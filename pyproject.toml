[project]
name = "littlebit-kernel"
version = "0.1.0"
description = "Fused 1-bit kernels for LittleBit sub-1-bit LLMs on Apple Silicon (MLX + Metal)"
authors = [
    { name = "iiviie", email = "divyanshverma158@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mlx>=0.32.4",
    "mlx-lm>=0.32.2",
    "numpy>=2.5.5",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "huggingface-hub>=2.4.0",
    "pytest>=9.2.0",
    "safetensors>=0.8.0",
    "torch>=2.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: large shapes (e.g. 4096x14336); deselect with -m \"not slow\"",
    "upstream: needs the upstream LittleBit clone at third_party/LittleBit (skipped if absent)",
]
